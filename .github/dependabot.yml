# Weekly dependency updates, grouped so each ecosystem opens at most one minor/patch PR a week.
# Security fixes come separately and straight away (Dependabot security updates are on in the repo settings).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The source generator builds against the oldest Roslyn it supports, so newer compilers can load it.
      - dependency-name: Microsoft.CodeAnalysis.*
      # .NET packages follow the target framework through $(DotNetVersion); they move with a new framework, not here.
      - dependency-name: Microsoft.Extensions.*
      - dependency-name: Microsoft.EntityFrameworkCore*
      - dependency-name: Microsoft.AspNetCore.*

  - package-ecosystem: npm
    directory: /src/TickerNet.Dashboard/wwwroot
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
