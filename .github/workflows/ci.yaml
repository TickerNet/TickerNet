name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/TickerNet.Dashboard/wwwroot/package-lock.json

      - name: Dashboard install
        working-directory: src/TickerNet.Dashboard/wwwroot
        run: npm ci

      - name: Dashboard build
        working-directory: src/TickerNet.Dashboard/wwwroot
        run: npm run build

      - name: Dashboard tests
        working-directory: src/TickerNet.Dashboard/wwwroot
        run: npm test

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The core package packs the generator DLL from its bin folder, so it builds first.
      - name: Build source generator
        run: dotnet build src/TickerNet.SourceGenerator/TickerNet.SourceGenerator.csproj -c Release

      - name: Build
        run: dotnet build TickerNet.slnx -c Release

      - name: Test
        run: dotnet test TickerNet.slnx -c Release --no-build
