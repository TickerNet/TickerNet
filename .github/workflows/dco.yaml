name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: Commits are signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check every commit has a matching Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$sha")
            case "$email" in *'[bot]@users.noreply.github.com') continue ;; esac
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -qF "Signed-off-by: $author"; then
              echo "::error::Commit $sha by $author has no 'Signed-off-by: $author' line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off your commits with: git rebase --signoff $BASE && git push --force-with-lease"
            echo "See CONTRIBUTING.md, rule 1."
            exit 1
          fi
          echo "Every commit is signed off."
