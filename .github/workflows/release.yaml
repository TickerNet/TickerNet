name: Release

# Publishes every TickerNet package to NuGet when a version tag (v1.2.3 or v1.2.3-preview.1) is
# pushed for a commit on main. Uses NuGet trusted publishing: GitHub's OIDC token is exchanged for a
# short-lived NuGet API key, so no key is stored in the repository. See CONTRIBUTING.md, "Releasing".

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and publish
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # NuGet trusted publishing
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-label."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't point to a commit on main. Releases come from main only."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check that NuGet publishing is set up
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org account that owns the trusted publishing policy (CONTRIBUTING.md, Releasing)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/TickerNet.Dashboard/wwwroot/package-lock.json

      - name: Dashboard install, build and test
        working-directory: src/TickerNet.Dashboard/wwwroot
        run: |
          npm ci
          npm run build
          npm test

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The core package packs the generator DLL from its bin folder, so it builds first.
      - name: Build source generator
        run: dotnet build src/TickerNet.SourceGenerator/TickerNet.SourceGenerator.csproj -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Build
        run: dotnet build TickerNet.slnx -c Release -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test TickerNet.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack TickerNet.slnx -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Check the packages
        run: |
          ls artifacts
          count=$(find artifacts -maxdepth 1 -name '*.nupkg' | wc -l)
          if [ "$count" -ne 9 ]; then
            echo "::error::Expected 9 packages, got $count. Update this check if a package was added or removed on purpose."
            exit 1
          fi

      - name: Get a short-lived NuGet API key
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag --title "TickerNet ${{ steps.version.outputs.version }}")
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg "${flags[@]}"
